name: One-off Policy Go Format

on:
  push:
    branches:
      - feat/policy-version-activation-v2
    paths:
      - .github/workflows/one-off-policy-gofmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/policy-version-activation-v2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Format policy manager
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/policy/postgres_management.go
          if git diff --quiet -- internal/policy/postgres_management.go; then
            echo 'Policy manager already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/policy/postgres_management.go
          git commit -m 'style: format policy manager'
          git push origin HEAD:feat/policy-version-activation-v2
