name: One-off Policy Test Helper

on:
  push:
    branches:
      - feat/policy-version-activation-v2
    paths:
      - .github/workflows/one-off-policy-test-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/policy-version-activation-v2
      - name: Patch test helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/httpapi/server_test.go')
          s = p.read_text()
          old = '"github.com/Imad-cpp/workload-trust-platform/internal/operatorauth"\n\t"github.com/Imad-cpp/workload-trust-platform/internal/registration"'
          new = '"github.com/Imad-cpp/workload-trust-platform/internal/operatorauth"\n\t"github.com/Imad-cpp/workload-trust-platform/internal/policy"\n\t"github.com/Imad-cpp/workload-trust-platform/internal/registration"'
          if old not in s:
              raise SystemExit('import anchor not found')
          s = s.replace(old, new, 1)
          anchor = 'func newTestHandler(t *testing.T, role operatorauth.Role, readinessErr error, lister workload.Lister, mutators ...registration.Mutator) http.Handler {'
          stub = '''type policyManagerStub struct{}\n\nfunc (policyManagerStub) Create(context.Context, policy.MutationActor, string, policy.CreateInput) (policy.CreateResult, error) {\n\treturn policy.CreateResult{}, nil\n}\n\nfunc (policyManagerStub) AppendVersion(context.Context, policy.MutationActor, string, string, policy.AppendVersionInput) (policy.VersionResult, error) {\n\treturn policy.VersionResult{}, nil\n}\n\nfunc (policyManagerStub) Activate(context.Context, policy.MutationActor, string, string, policy.ActivateInput) (policy.PolicyResult, error) {\n\treturn policy.PolicyResult{}, nil\n}\n\n'''
          if anchor not in s:
              raise SystemExit('helper anchor not found')
          s = s.replace(anchor, stub + anchor, 1)
          dep = '\t\tRegistrationMutations: mutator,\n\t\tAuthenticator:         authenticator,'
          replacement = '\t\tRegistrationMutations: mutator,\n\t\tPolicyManager:         policyManagerStub{},\n\t\tAuthenticator:         authenticator,'
          if dep not in s:
              raise SystemExit('dependency anchor not found')
          s = s.replace(dep, replacement, 1)
          p.write_text(s)
          PY
          gofmt -w internal/httpapi/server_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/httpapi/server_test.go
          git commit -m 'test: wire policy manager into HTTP helper'
          git push origin HEAD:feat/policy-version-activation-v2
