name: One-off Diagnostics Test Helper

on:
  push:
    branches:
      - feat/cli-diagnostics
    paths:
      - .github/workflows/one-off-diagnostics-test-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cli-diagnostics
      - name: Patch legacy HTTP helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/httpapi/server_test.go')
          s = p.read_text()
          anchor = '\t\tWorkloads:             lister,\n\t\tRegistrationMutations: mutator,'
          replacement = '\t\tWorkloads:             lister,\n\t\tDiagnostics:           &diagnosticsStub{},\n\t\tRegistrationMutations: mutator,'
          if anchor not in s:
              raise SystemExit('dependency anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY
          gofmt -w internal/httpapi/server_test.go internal/httpapi/diagnostics_test.go internal/diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/httpapi/server_test.go internal/httpapi/diagnostics_test.go internal/diagnostics
          git commit -m 'test: wire diagnostics into HTTP test helper'
          git push origin HEAD:feat/cli-diagnostics
