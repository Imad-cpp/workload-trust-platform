name: One-off Diagnostics Debug

on:
  push:
    branches:
      - feat/cli-diagnostics
    paths:
      - .github/workflows/one-off-diagnostics-debug.yml

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: workload_trust_diagnostics_debug
          POSTGRES_USER: workload_trust
          POSTGRES_PASSWORD: workload-trust-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workload_trust -d workload_trust_diagnostics_debug"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://workload_trust:workload-trust-ci@127.0.0.1:5432/workload_trust_diagnostics_debug?sslmode=disable
      TEST_DATABASE_URL: postgres://workload_trust:workload-trust-ci@127.0.0.1:5432/workload_trust_diagnostics_debug?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cli-diagnostics
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply migrations
        run: ./scripts/db-migrate.sh up
      - name: Capture diagnostics package result
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .debug
          set +e
          go test -race -count=1 -v ./internal/diagnostics >/tmp/diag-test.log 2>&1
          status=$?
          set -e
          sed -E 's#(postgres(ql)?://)[^@[:space:]]+@#\1[redacted]@#g' /tmp/diag-test.log \
            | tail -n 120 > .debug/diagnostics-failure.txt
          printf '\nexit_status=%d\n' "${status}" >> .debug/diagnostics-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .debug/diagnostics-failure.txt
          git commit -m 'test: capture diagnostics failure evidence'
          git push origin HEAD:feat/cli-diagnostics
          exit "${status}"
