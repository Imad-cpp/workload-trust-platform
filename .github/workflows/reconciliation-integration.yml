name: SPIRE Reconciliation Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: workload_trust_reconcile
          POSTGRES_USER: workload_trust
          POSTGRES_PASSWORD: workload-trust-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workload_trust -d workload_trust_reconcile"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://workload_trust:workload-trust-ci@127.0.0.1:5432/workload_trust_reconcile?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Download committed modules
        run: go mod download

      - name: Run real PostgreSQL to SPIRE reconciliation lifecycle
        run: ./scripts/reconciliation-ci.sh

      - name: Cleanup identity lab
        if: always()
        run: ./scripts/lab-down.sh
