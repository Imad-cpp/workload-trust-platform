name: workload-trust-dev

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: workload_trust
      POSTGRES_USER: workload_trust
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workload_trust -d workload_trust"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - workload-trust-postgres:/var/lib/postgresql/data

volumes:
  workload-trust-postgres:
