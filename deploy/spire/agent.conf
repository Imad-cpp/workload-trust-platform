agent {
    data_dir = ".lab/data/agent"
    log_level = "DEBUG"
    trust_domain = "workload-trust.test"
    server_address = "127.0.0.1"
    server_port = 8081
    socket_path = "/tmp/workload-trust-lab/agent.sock"

    # Local lab only. Production deployments must use an authenticated
    # bootstrap trust mechanism appropriate to the deployment environment.
    insecure_bootstrap = true
}

plugins {
    KeyManager "disk" {
        plugin_data {
            directory = ".lab/data/agent"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
            use_new_container_locator = true
            verbose_container_locator_logs = true
        }
    }
}
