server {
    bind_address = "127.0.0.1"
    bind_port = "8081"
    socket_path = "/tmp/workload-trust-lab/server.sock"
    trust_domain = "workload-trust.test"
    data_dir = ".lab/data/server"
    log_level = "INFO"
    default_x509_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = ".lab/data/server/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = ".lab/data/server/keys.json"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }
}
